name: Actualizar informe de mercado

# Corre antes de la apertura de Tokio, Europa, Santiago y Nueva York, y después del cierre de Wall Street.
# Las horas están en UTC y cubren el horario de verano de cada país; el script decide si toca informar
# (ventana de 100 min antes de la apertura) y no repite un informe de la misma sesión y día.
# Para detener las actualizaciones: borra este archivo o desactiva el workflow en la pestaña Actions.
on:
  schedule:
    - cron: "0 23 * * 0-4"      # Tokio (lun-vie)
    - cron: "0 6 * * 1-5"       # Europa
    - cron: "0 7 * * 1-5"       # Europa
    - cron: "30 11 * * 1-5"     # Santiago
    - cron: "30 12 * * 1-5"     # Santiago / Nueva York
    - cron: "30 13 * * 1-5"     # Nueva York
    - cron: "30 21 * * 1-5"     # Cierre de Wall Street
    - cron: "30 22 * * 1-5"     # Cierre de Wall Street
    - cron: "0 15 * * 0,6"      # Cripto fin de semana
  workflow_dispatch:
    inputs:
      sesion:
        description: "auto | manual | nueva_york | europa | tokio | santiago | cierre | cripto"
        default: "manual"

permissions:
  contents: write

concurrency:
  group: actualizar-mercado
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generar datos
        run: python -m pipeline.run --sesion "${{ github.event.inputs.sesion || 'auto' }}"
      - name: Publicar cambios
        run: |
          git config user.name "mercado-bot"
          git config user.email "mercado-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualizar informe de mercado"
          git pull --rebase
          git push
