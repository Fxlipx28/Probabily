name: Actualizar informe de mercado

# Recalcula TODO (precios, simulaciones, probabilidades) antes de la apertura de Tokio, Europa,
# Santiago y Nueva York, y después del cierre de Wall Street. Las horas están en UTC y cubren el
# horario de verano; el script decide si toca informar y no repite una sesión ya publicada.
# Los datos se publican en la rama "datos" (sin historial, así el repositorio no crece).
# Para detener las actualizaciones: borra este archivo o desactiva el workflow en la pestaña Actions.
on:
  schedule:
    - cron: "0 23 * * 0-4"      # Tokio (lun-vie)
    - cron: "0 6 * * 1-5"       # Europa
    - cron: "0 7 * * 1-5"       # Europa
    - cron: "30 11 * * 1-5"     # Santiago
    - cron: "30 12 * * 1-5"     # Santiago / Nueva York
    - cron: "30 13 * * 1-5"     # Nueva York
    - cron: "30 21 * * 1-5"     # Cierre de Wall Street
    - cron: "30 22 * * 1-5"     # Cierre de Wall Street
    - cron: "0 15 * * 0,6"      # Cripto fin de semana
  workflow_dispatch:
    inputs:
      sesion:
        description: "auto | manual | nueva_york | europa | tokio | santiago | cierre | cripto"
        default: "manual"

permissions:
  contents: write

concurrency:
  group: actualizar-mercado
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Traer el informe anterior (para no repetir sesiones)
        continue-on-error: true
        run: git clone --depth 1 --branch datos "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prev
      - name: Generar datos
        run: python -m pipeline.run --sesion "${{ github.event.inputs.sesion || 'auto' }}" --out salida --prev prev/latest.json
      - name: Publicar en la rama datos
        run: |
          if [ ! -f salida/latest.json ]; then echo "No hay informe nuevo (sesión ya publicada o fuera de ventana)"; exit 0; fi
          cd salida
          git init -q -b datos
          git config user.name "mercado-bot"
          git config user.email "mercado-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Datos de mercado $(date -u +%F\ %H:%M) UTC"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos
